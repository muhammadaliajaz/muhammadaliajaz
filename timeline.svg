svg_fixed = '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="400" rx="16" fill="url(#bg)" />

  <!-- Ambient background lighting -->
  <circle cx="820" cy="140" r="140" fill="#1e1b4b" opacity="0.4" />
  <circle cx="850" cy="280" r="160" fill="#065f46" opacity="0.25" />
  <circle cx="900" cy="180" r="6" fill="#34d399" filter="url(#glow)" />
  <circle cx="935" cy="225" r="4" fill="#a78bfa" filter="url(#glow)" />
  <circle cx="865" cy="265" r="5" fill="#60a5fa" filter="url(#glow)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="998" height="398" rx="15" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8" />

  <!-- Wavy Timeline Line -->
  <path d="M 0 280 C 250 330, 750 210, 1000 260" fill="none" stroke="url(#wave)" stroke-width="3" opacity="0.7" />

  <!-- Card 1 (Virtual University) -->
  <g transform="translate(45, 35)">
    <!-- Node on wave -->
    <circle cx="121" cy="223" r="7" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="121" cy="223" r="3.5" fill="#ffffff" />
    
    <!-- Card Box -->
    <rect x="0" y="0" width="280" height="165" rx="12" fill="url(#card)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Content -->
    <text x="20" y="30" fill="#60a5fa" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">OCTOBER 2022 – SEPTEMBER 2026</text>
    <text x="20" y="58" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">Virtual University of Pakistan</text>
    <text x="20" y="81" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500">BS Software Engineering</text>
    
    <circle cx="26" cy="115" r="3" fill="#3b82f6" />
    <text x="38" y="119" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Comprehensive Software Dev &amp; CS</text>
    <circle cx="26" cy="138" r="3" fill="#3b82f6" />
    <text x="38" y="142" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Degree Complete</text>
  </g>

  <!-- Card 2 (DUO SOLS) -->
  <g transform="translate(360, 35)">
    <!-- Node on wave -->
    <circle cx="121" cy="207" r="7" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="121" cy="207" r="3.5" fill="#ffffff" />
    
    <!-- Card Box -->
    <rect x="0" y="0" width="280" height="165" rx="12" fill="url(#card)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Content -->
    <text x="20" y="30" fill="#a78bfa" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">JANUARY 2021 – MAY 2025</text>
    <text x="20" y="58" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">DUO SOLS</text>
    <text x="20" y="81" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500">Junior Developer</text>
    
    <circle cx="26" cy="115" r="3" fill="#8b5cf6" />
    <text x="38" y="119" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Backend modules &amp; SQL optimization</text>
    <circle cx="26" cy="138" r="3" fill="#8b5cf6" />
    <text x="38" y="142" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Web analytics tags configuration</text>
  </g>

  <!-- Card 3 (ANALOG.PK) -->
  <g transform="translate(675, 35)">
    <!-- Node on wave -->
    <circle cx="121" cy="226" r="7" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="121" cy="226" r="3.5" fill="#ffffff" />
    
    <!-- Card Box -->
    <rect x="0" y="0" width="280" height="165" rx="12" fill="url(#card)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.6" />
    
    <!-- Content -->
    <text x="20" y="30" fill="#22d3ee" font-family="Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" letter-spacing="0.5">JUNE 2025 – AUGUST 2025</text>
    <text x="20" y="58" fill="#f8fafc" font-family="Segoe UI, system-ui, sans-serif" font-size="15" font-weight="700">ANALOG.PK</text>
    <text x="20" y="81" fill="#cbd5e1" font-family="Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500">Software Intern</text>
    
    <circle cx="26" cy="115" r="3" fill="#06b6d4" />
    <text x="38" y="119" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">Software engineering workflows</text>
    <circle cx="26" cy="138" r="3" fill="#06b6d4" />
    <text x="38" y="142" fill="#94a3b8" font-family="Segoe UI, system-ui, sans-serif" font-size="11">System testing &amp; support</text>
  </g>

</svg>
