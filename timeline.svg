<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Glowing Wave Gradient -->
    <linearGradient id="waveGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="400" rx="16" fill="url(#bgGradient)" />

  <!-- Ambient Background Circles (Matching Reference Style) -->
  <circle cx="820" cy="140" r="140" fill="#1e1b4b" opacity="0.4" />
  <circle cx="850" cy="280" r="160" fill="#065f46" opacity="0.25" />
  <circle cx="900" cy="180" r="6" fill="#34d399" filter="url(#glow)" />
  <circle cx="935" cy="225" r="4" fill="#a78bfa" filter="url(#glow)" />
  <circle cx="865" cy="265" r="5" fill="#60a5fa" filter="url(#glow)" />

  <!-- Border Frame -->
  <rect x="1" y="1" width="998" height="398" rx="15" fill="none" stroke="#1e293b" stroke-width="2" opacity="0.8" />

  <!-- Decorative Wave Path -->
  <path d="M 0 320 C 250 360, 750 260, 1000 310" fill="none" stroke="url(#waveGradient)" stroke-width="2.5" opacity="0.6" />

  <!-- TIMELINE ENTRIES -->

  <!-- Entry 1: Virtual University of Pakistan -->
  <g transform="translate(50, 60)">
    <!-- Node Marker on Wave -->
    <circle cx="116" cy="233" r="6" fill="#3b82f6" filter="url(#glow)" />
    <circle cx="116" cy="233" r="3" fill="#ffffff" />
    
    <!-- Card Box -->
    <rect x="0" y="0" width="272" height="155" rx="12" fill="url(#cardBg)" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.5" />
    <path d="M 12 0 L 80 0 Q 90 0 90 10 L 90 10 Q 90 20 80 20 L 12 20 Q 2 20 2 10 L 2 10 Q 2 0 12 0 Z" fill="#3b82f6" opacity="0.15" />
    
    <!-- Card Content -->
    <text x="20" y="32" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">OCTOBER 2022 – SEPTEMBER 2026</text>
    <text x="20" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">Virtual University of Pakistan</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="500">BS Software Engineering</text>
    
    <!-- Bullet points / details -->
    <circle cx="26" cy="113" r="3" fill="#3b82f6" />
    <text x="38" y="117" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Comprehensive Software Dev & CS</text>
    <circle cx="26" cy="133" r="3" fill="#3b82f6" />
    <text x="38" y="137" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Degree Complete</text>
  </g>

  <!-- Entry 2: DUO SOLS -->
  <g transform="translate(364, 60)">
    <!-- Node Marker on Wave -->
    <circle cx="116" cy="264" r="6" fill="#8b5cf6" filter="url(#glow)" />
    <circle cx="116" cy="264" r="3" fill="#ffffff" />

    <!-- Card Box -->
    <rect x="0" y="0" width="272" height="155" rx="12" fill="url(#cardBg)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Card Content -->
    <text x="20" y="32" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">JANUARY 2021 – MAY 2025</text>
    <text x="20" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">DUO SOLS</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Junior Developer</text>
    
    <!-- Bullet points / details -->
    <circle cx="26" cy="113" r="3" fill="#8b5cf6" />
    <text x="38" y="117" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Backend modules & SQL optimization</text>
    <circle cx="26" cy="133" r="3" fill="#8b5cf6" />
    <text x="38" y="137" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Web analytics tags configuration</text>
  </g>

  <!-- Entry 3: ANALOG.PK -->
  <g transform="translate(678, 60)">
    <!-- Node Marker on Wave -->
    <circle cx="116" cy="292" r="6" fill="#06b6d4" filter="url(#glow)" />
    <circle cx="116" cy="292" r="3" fill="#ffffff" />

    <!-- Card Box -->
    <rect x="0" y="0" width="272" height="155" rx="12" fill="url(#cardBg)" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.5" />
    
    <!-- Card Content -->
    <text x="20" y="32" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">JUNE 2025 – AUGUST 2025</text>
    <text x="20" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">ANALOG.PK</text>
    <text x="20" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Software Intern</text>
    
    <!-- Bullet points / details -->
    <circle cx="26" cy="113" r="3" fill="#06b6d4" />
    <text x="38" y="117" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Software engineering workflows</text>
    <circle cx="26" cy="133" r="3" fill="#06b6d4" />
    <text x="38" y="137" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">System testing & support</text>
  </g>

</svg>