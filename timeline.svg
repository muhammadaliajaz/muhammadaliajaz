<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="Career and education timeline">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="52%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #aab6cc; }
      .white { fill: #f8fafc; }
      .chip { fill: #111c32; stroke: #405174; stroke-width: 1; }
      .glow { animation: pulse 3.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes drift { 0% { transform:translateX(-15px) } 100% { transform:translateX(15px) } }
      @keyframes grow { from { transform:scaleX(.15); opacity:.35 } to { transform:scaleX(1); opacity:1 } }
    </style>
  </defs>

  <rect width="1200" height="330" rx="22" fill="#0b1220" stroke="#263653"/>
  <text x="44" y="54" class="white" font-size="22" font-weight="700">Career & education timeline</text>
  <line x1="80" y1="100" x2="80" y2="282" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>
<circle cx="80" cy="112" r="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="112" y="94" width="1030" height="36" rx="10" fill="#111c32" stroke="#344765"/>
    <rect x="112" y="94" width="5" height="36" rx="2" fill="url(#grad)" style="transform-origin:114px 112px; animation:grow 1.2s ease-out both"/>
    <text x="136" y="117" class="muted" font-size="14">Jan 2021 – May 2025</text>
    <text x="390" y="117" class="white" font-size="15" font-weight="600">Junior Developer · DUO SOLS</text><circle cx="80" cy="192" r="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="112" y="174" width="1030" height="36" rx="10" fill="#111c32" stroke="#344765"/>
    <rect x="112" y="174" width="5" height="36" rx="2" fill="url(#grad)" style="transform-origin:114px 192px; animation:grow 1.2s ease-out both"/>
    <text x="136" y="197" class="muted" font-size="14">Oct 2022 – Sep 2026</text>
    <text x="390" y="197" class="white" font-size="15" font-weight="600">BS Software Engineering · Virtual University of Pakistan</text><circle cx="80" cy="272" r="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="112" y="254" width="1030" height="36" rx="10" fill="#111c32" stroke="#344765"/>
    <rect x="112" y="254" width="5" height="36" rx="2" fill="url(#grad)" style="transform-origin:114px 272px; animation:grow 1.2s ease-out both"/>
    <text x="136" y="277" class="muted" font-size="14">Jun 2025 – Aug 2025</text>
    <text x="390" y="277" class="white" font-size="15" font-weight="600">Software Intern · ANALOG.PK</text></svg>
