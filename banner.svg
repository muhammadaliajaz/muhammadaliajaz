<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Muhammad Ali — software engineering profile banner">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="52%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #aab6cc; }
      .white { fill: #f8fafc; }
      .chip { fill: #111c32; stroke: #405174; stroke-width: 1; }
      .glow { animation: pulse 3.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes drift { 0% { transform:translateX(-15px) } 100% { transform:translateX(15px) } }
      @keyframes grow { from { transform:scaleX(.15); opacity:.35 } to { transform:scaleX(1); opacity:1 } }
    </style>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#0b1220"/>
  <rect x="1" y="1" width="1198" height="298" rx="23" fill="none" stroke="url(#grad)" stroke-width="2"/>
  <circle cx="1040" cy="38" r="150" fill="#2563eb" opacity=".12"/>
  <circle cx="1120" cy="260" r="170" fill="#14b8a6" opacity=".10"/>
  <path d="M0 244 C240 180 390 330 650 240 S1000 170 1200 220" fill="none" stroke="url(#line)" stroke-width="2" opacity=".45"/>
  <text x="64" y="108" class="white" font-size="48" font-weight="750">MUHAMMAD ALI</text>
  <text x="66" y="150" class="muted" font-size="21">Software Engineering • Developer</text>
  <g transform="translate(66 190)">
    <rect class="chip" width="112" height="38" rx="19"/><text x="56" y="25" text-anchor="middle" class="white" font-size="15">JavaScript</text>
    <rect class="chip" x="124" width="92" height="38" rx="19"/><text x="170" y="25" text-anchor="middle" class="white" font-size="15">React</text>
    <rect class="chip" x="228" width="84" height="38" rx="19"/><text x="270" y="25" text-anchor="middle" class="white" font-size="15">Laravel</text>
    <rect class="chip" x="324" width="86" height="38" rx="19"/><text x="367" y="25" text-anchor="middle" class="white" font-size="15">Python</text>
    <rect class="chip" x="422" width="104" height="38" rx="19"/><text x="474" y="25" text-anchor="middle" class="white" font-size="15">PostgreSQL</text>
    <rect class="chip" x="538" width="82" height="38" rx="19"/><text x="579" y="25" text-anchor="middle" class="white" font-size="15">Docker</text>
  </g>
  <g class="glow"><circle cx="1080" cy="116" r="7" fill="#2dd4bf"/><circle cx="1122" cy="145" r="4" fill="#a78bfa"/><circle cx="1038" cy="178" r="5" fill="#60a5fa"/></g>
</svg>
