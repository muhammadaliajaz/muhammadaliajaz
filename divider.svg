<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="18" viewBox="0 0 1200 18" role="img" aria-label="Animated blue purple teal gradient divider">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="52%" stop-color="#7c3aed"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
      .muted { fill: #aab6cc; }
      .white { fill: #f8fafc; }
      .chip { fill: #111c32; stroke: #405174; stroke-width: 1; }
      .glow { animation: pulse 3.8s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { opacity:.55 } 50% { opacity:1 } }
      @keyframes drift { 0% { transform:translateX(-15px) } 100% { transform:translateX(15px) } }
      @keyframes grow { from { transform:scaleX(.15); opacity:.35 } to { transform:scaleX(1); opacity:1 } }
    </style>
  </defs>

  <rect x="0" y="7" width="1200" height="3" rx="1.5" fill="#1e293b"/>
  <rect x="0" y="7" width="1200" height="3" rx="1.5" fill="url(#line)" opacity=".95">
    <animate attributeName="opacity" values=".35;1;.35" dur="3.5s" repeatCount="indefinite"/>
  </rect>
</svg>
